set -g base-index 1
setw -g pane-base-index 1
set -g mouse off
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-256color:RGB'
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g set-clipboard on
# OSC52を外側の端末(wezterm)へ確実にパススルーする
set -as terminal-features ',*:clipboard'

set-option -g focus-events on
set-option -g terminal-features ",xterm-256color:Sync,tmux-256color:Sync"
# image.nvim(kittyバックエンド)などがエスケープシーケンスを外側の端末へ送れるようにする
set -g allow-passthrough on

# ペインの分割キーの設定
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 起動済みのセッションでも設定を反映
bind r source-file ~/.tmux.conf \; display "Reoaded!"

# コピーモードの設定
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# prefix + W でgit worktree作成 + ウィンドウ作成（名前付き）
bind W command-prompt -p "worktree branch:" "run-shell '$HOME/dotfiles/scripts/tmux_window_with_git_worktree.sh %% > /tmp/wtw.log 2>&1'"

# ステータスバー全体の背景・文字色
set -g status-style bg=colour234,fg=colour137
# 現在のウィンドウを強調表示
setw -g window-status-current-style fg=black,bg=green,bold
# 通常のウィンドウ(非アクティブ)のスタイル
setw -g window-status-style fg=colour245,bg=default

# Prefix + O でポップアップを開閉（すでに開いていれば閉じる）
bind O popup -d "#{pane_current_path}" -xC -yC -w80% -h80%
